<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS 3D Laboratory</title>
  <link rel="icon" type="image/png" href="./assets/devices/logo.png" />
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main id="viewport" aria-label="交互式 3D 实验室">
    <svg id="ai-tether" class="ai-tether hidden" aria-hidden="true">
      <path id="ai-tether-casing" />
      <path id="ai-tether-line" />
      <circle id="ai-tether-ring" />
      <circle id="ai-tether-dot" />
    </svg>
    <div id="ai-tether-tag" class="ai-tether-tag hidden">
      <img src="./assets/xiaotong.png" alt="" />
      <span id="ai-tether-id"></span>
      <b>AI 巡检中</b>
    </div>
    <div id="hud">
      <nav class="toolbar" aria-label="场景工具">
        <span id="view-name">实验室总览</span>
        <span class="hud-divider" aria-hidden="true"></span>
        <div class="tool-group">
          <button type="button" class="tool-button" data-action="overview" title="返回总览 (Home)" aria-label="返回总览 (Home)">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M2 7.5L8 2.5l6 5M3.5 6.5V13.5h9V6.5" /></svg>
          </button>
          <button type="button" class="tool-button" data-action="reset" title="重置视角 (R)" aria-label="重置视角 (R)">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.5V5h-2.5" /></svg>
          </button>
          <button type="button" class="tool-button quality-button" data-action="quality" title="切换画质"><span id="quality-label">HQ</span></button>
          <button type="button" class="tool-button" data-action="fullscreen" title="全屏显示" aria-label="全屏显示" aria-pressed="false">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M6 2.5H2.5V6M10 2.5h3.5V6M2.5 10v3.5H6M13.5 10v3.5H10" /></svg>
          </button>
        </div>
        <span class="hud-divider" aria-hidden="true"></span>
        <span class="navigation-hint">左键 旋转 · 右键 平移 · 滚轮 缩放 · 右键设备 编辑 / 删除</span>
      </nav>
      <div class="view-status">
        <svg class="compass" role="img" aria-label="指北针" width="28" height="28" viewBox="0 0 28 28" fill="none">
          <circle cx="14" cy="14" r="12.5" stroke-width="1" />
          <g id="compass-arrow"><path d="M14 5l-3.5 13 3.5-2.2 3.5 2.2z" /></g>
        </svg>
        <div class="view-readout">
          <span id="zoom-label">100%</span>
          <span id="fps-label">WEBGL2</span>
        </div>
      </div>
      <section id="ai-inspection-banner" class="ai-inspection-banner hidden" aria-label="AI 大脑规则巡检">
        <span class="inspection-symbol" aria-hidden="true"><img src="./assets/xiaotong.png" alt="" /></span>
        <div>
          <strong id="ai-inspection-target">AI 巡检中</strong>
          <span id="ai-inspection-task">等待设备数据</span>
        </div>
        <i aria-hidden="true"></i>
      </section>
      <div id="focus-badge" class="focus-badge hidden"><span></span><b id="focus-text"></b></div>
      <div id="toast" class="toast hidden"></div>
    </div>
    <div id="scene-error" class="scene-error hidden"><strong>3D 场景加载失败</strong><p id="scene-error-text"></p><button onclick="location.reload()">重新加载</button></div>
  </main>
  <script>
    window.reportSceneError = function (message) {
      const text = String(message || '未知错误');
      document.getElementById('scene-error')?.classList.remove('hidden');
      const target = document.getElementById('scene-error-text');
      if (target) target.textContent = text;
      if (window.chrome?.webview) window.chrome.webview.postMessage({ type: 'scene-error', message: text });
    };
    window.addEventListener('error', event => {
      if (event.message) window.reportSceneError(event.message);
    });
    window.addEventListener('unhandledrejection', event => window.reportSceneError(event.reason));
  </script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
